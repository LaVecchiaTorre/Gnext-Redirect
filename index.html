<!DOCTYPE html>
<html>
<head>
    <title>GNext App Download</title> 
    <script type="text/javascript">
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.replace("https://apps.apple.com/it/app/id1630713314");
            } 
            else if (/android/i.test(userAgent)) {
                window.location.replace("https://play.google.com/store/apps/details?id=org.pbbs.gmaxevo");
            } 
            else {
                window.location.replace("https://www.bettinivideo.com");
            }
        };
    </script>
</head>
<body>
    <p>Reindirizzamento allo store in corso...</p>
</body>
</html>
